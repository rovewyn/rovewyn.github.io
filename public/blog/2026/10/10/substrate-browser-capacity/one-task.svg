<svg xmlns="http://www.w3.org/2000/svg" viewBox="4 4 744 88" width="744" height="88" role="img" aria-labelledby="task-title task-desc">
  <title id="task-title">The four steps in one browser Task</title>
  <desc id="task-desc">Open the local web page, enter synthetic text, click Save note, then take a screenshot.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 Z" fill="#a1b2be"/>
    </marker>
  </defs>
  <g fill="#14212b" stroke="#536b7d">
    <rect x="12" y="12" width="152" height="72"/>
    <rect x="204" y="24" width="152" height="48"/>
    <rect x="396" y="24" width="152" height="48"/>
    <rect x="588" y="12" width="152" height="72"/>
  </g>
  <g fill="none" stroke="#a1b2be" marker-end="url(#arrow)">
    <path d="M164 48 H200"/>
    <path d="M356 48 H392"/>
    <path d="M548 48 H584"/>
  </g>
  <g fill="#e6edf0" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="16" text-anchor="middle">
    <text x="88" y="42">Open local<tspan x="88" dy="24">web page</tspan></text>
    <text x="280" y="54">Enter text</text>
    <text x="472" y="54">Click Save note</text>
    <text x="664" y="42">Take PNG<tspan x="664" dy="24">screenshot</tspan></text>
  </g>
</svg>
